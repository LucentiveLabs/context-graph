name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type recover to retry the unchanged release gates
        required: true
permissions: {}
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'LucentiveLabs/context-graph' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global --ignore-scripts npm@12.0.1
      - run: npm ci --ignore-scripts
      - run: npm test && npm run check:pack && npm audit --omit=dev --audit-level=high
      - run: node scripts/release.mjs prepare
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global --ignore-scripts npm@12.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact
          path: release-artifact
      - run: node scripts/release.mjs publish
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global --ignore-scripts npm@12.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact
          path: release-artifact
      - run: node scripts/release.mjs verify
