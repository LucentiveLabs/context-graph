# Reusable security gate — drop into each repo as .github/workflows/security-gate.yml
#
# Runs on every PR. Hardened policy: secrets, HIGH/CRITICAL dependency CVEs,
# and CRITICAL/HIGH/ERROR SAST findings block; lower-severity deps/SAST findings
# report into the job summary. Deterministic, non-LLM → permitted in GitHub
# Actions by the harness contract.
#
# Actions are pinned by commit SHA (not tag). Scanner versions are pinned below;
# bump them deliberately. Kept intentionally cheap so it is never disabled for
# spend — heavy build/test stays in the repo's own (dispatch-only) workflows.
name: security-gate

on:
  pull_request_target:
  workflow_dispatch:
  schedule:
    # Weekly recurring scan (C5) — Mon 06:00 UTC. Catches newly-disclosed
    # dependency CVEs and any secret that slipped in between PRs.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  OSV_SCANNER_VERSION: "2.4.0"
  SEMGREP_VERSION: "1.168.0"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout scan target (data only, never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Install scanners
        run: |
          set -euo pipefail
          # gitleaks — download + verify against the release's official checksums file.
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o gitleaks.tgz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks_checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v n="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '$2==n{print $1"  gitleaks.tgz"}' gitleaks_checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
          # osv-scanner — download + verify against the release's official checksums file.
          # NOTE: osv-scanner v2 ships the checksums as `osv-scanner_SHA256SUMS`;
          # there is no `osv-scanner_<version>_checksums.txt` (that URL 404s and the
          # install silently fails, so the whole gate never goes green).
          obase="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -fsSL -o osv-scanner "${obase}/osv-scanner_linux_amd64"
          curl -fsSL -o osv_checksums.txt "${obase}/osv-scanner_SHA256SUMS"
          awk '$2=="osv-scanner_linux_amd64"{print $1"  osv-scanner"}' osv_checksums.txt | sha256sum -c -
          install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version
          # semgrep — PINNED version (no mutable latest for a blocking gate).
          pipx install "semgrep==${SEMGREP_VERSION}" || pip install --user "semgrep==${SEMGREP_VERSION}"
          semgrep --version

      - name: Run security gate
        env:
          EXPECTED_SCAN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SCAN_SHA"
          test "$(git -C candidate rev-parse --is-shallow-repository)" = false
          # Only the base scanner executes. No package install, candidate script,
          # PR-controlled suppression policy, cache, write token or secret is used.
          bash trusted/scripts/security-scan.sh --repo "$GITHUB_WORKSPACE/candidate" --untrusted --mode full --fail-on high
